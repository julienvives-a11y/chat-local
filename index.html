<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN Chat</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #2a2f45;
    --accent: #00ff88;
    --accent2: #0088ff;
    --text: #e2e8f0;
    --muted: #64748b;
    --danger: #ff4466;
  }

  body {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* === JOIN SCREEN === */
  #join-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 0;
  }

  .join-box {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 48px 56px;
    width: min(480px, 90vw);
    position: relative;
    overflow: hidden;
  }

  .join-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .join-box::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top left, rgba(0,255,136,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .join-logo {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .join-logo::before {
    content: '●';
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .join-title {
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .join-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 40px;
    font-family: 'Space Grotesk', sans-serif;
  }

  .join-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .join-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.2s;
    caret-color: var(--accent);
  }

  .join-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,255,136,0.08);
  }

  .join-btn {
    width: 100%;
    margin-top: 16px;
    background: var(--accent);
    color: #000;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 15px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
  }

  .join-btn:hover {
    background: #00ffaa;
    transform: translateY(-1px);
  }

  .join-btn:active { transform: translateY(0); }

  /* === MAIN LAYOUT === */
  #app {
    display: none;
    height: 100vh;
    flex-direction: column;
  }

  #app.visible { display: flex; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-shrink: 0;
  }

  .header-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(0,255,136,0); }
  }

  .header-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .header-sub {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  #online-count {
    color: var(--accent);
    font-weight: 700;
  }

  /* Main area */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  .sidebar-title {
    padding: 16px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  #user-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .user-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    font-size: 12px;
    border-radius: 4px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateX(-8px); } }

  .user-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Messages */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    display: flex;
    gap: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    animation: msgIn 0.2s ease;
    align-items: flex-start;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
  }

  .msg:hover { background: rgba(255,255,255,0.02); }

  .msg-time {
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    flex-shrink: 0;
    width: 40px;
  }

  .msg-name {
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }

  .msg-text {
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
    font-family: 'Space Grotesk', sans-serif;
    flex: 1;
  }

  .msg-self .msg-name::after {
    content: ' (vous)';
    font-weight: 400;
    color: var(--muted);
    font-size: 10px;
  }

  .system-msg {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 8px;
    font-style: italic;
  }

  /* Typing indicator */
  #typing-area {
    height: 24px;
    padding: 0 20px;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    flex-shrink: 0;
  }

  /* Input */
  .input-area {
    padding: 16px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    caret-color: var(--accent);
  }

  #msg-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,255,136,0.06);
  }

  #send-btn {
    background: var(--accent);
    color: #000;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 12px 22px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  #send-btn:hover { background: #00ffaa; }

  /* Scrollbar for sidebar */
  #user-list::-webkit-scrollbar { width: 4px; }
  #user-list::-webkit-scrollbar-track { background: transparent; }
  #user-list::-webkit-scrollbar-thumb { background: var(--border); }

  /* Responsive */
  @media (max-width: 600px) {
    .sidebar { display: none; }
    .join-box { padding: 32px 24px; }
  }
</style>
</head>
<body>

<!-- JOIN SCREEN -->
<div id="join-screen">
  <div class="join-box">
    <div class="join-logo">LAN Chat</div>
    <h1 class="join-title">Rejoindre</h1>
    <p class="join-sub">Messagerie locale — réseau privé uniquement</p>
    <div class="join-label">Ton pseudo</div>
    <input class="join-input" id="name-input" type="text" placeholder="ex: Jean, Alice…" maxlength="20" autofocus>
    <button class="join-btn" onclick="join()">Entrer dans le chat →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="header-dot"></div>
    <span class="header-title">LAN Chat</span>
    <span class="header-sub"><span id="online-count">0</span> en ligne</span>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-title">Connectés</div>
      <div id="user-list"></div>
    </div>

    <div class="chat-area">
      <div id="messages"></div>
      <div id="typing-area"></div>
      <div class="input-area">
        <input id="msg-input" type="text" placeholder="Tape ton message…" maxlength="500">
        <button id="send-btn" onclick="sendMessage()">Envoyer</button>
      </div>
    </div>
  </div>
</div>

<script>
  let ws = null;
  let myName = '';
  let myColor = '';
  let typingTimeout = null;

  // Enter key handlers
  document.getElementById('name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') join();
  });

  function join() {
    const name = document.getElementById('name-input').value.trim();
    if (!name) return;

    myName = name;

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}`);

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'join', name }));
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      handleMessage(data);
    };

    ws.onclose = () => {
      appendSystem('Déconnecté du serveur. Recharge la page pour reconnecter.');
    };

    ws.onerror = () => {
      appendSystem('Erreur de connexion.');
    };
  }

  function handleMessage(data) {
    switch (data.type) {
      case 'welcome':
        myColor = data.color;
        document.getElementById('join-screen').style.display = 'none';
        document.getElementById('app').classList.add('visible');
        updateUsers(data.users);
        // Load history
        if (data.history) {
          data.history.forEach(msg => appendMessage(msg));
        }
        break;

      case 'message':
        appendMessage(data);
        break;

      case 'system':
        appendSystem(data.text);
        break;

      case 'user_joined':
      case 'user_left':
        updateUsers(data.users);
        break;

      case 'typing':
        showTyping(data.name);
        break;
    }
  }

  function appendMessage(data) {
    const div = document.createElement('div');
    div.className = 'msg' + (data.name === myName ? ' msg-self' : '');

    div.innerHTML = `
      <span class="msg-time">${data.time}</span>
      <span class="msg-name" style="color:${data.color}">${escHtml(data.name)}</span>
      <span class="msg-text">${escHtml(data.text)}</span>
    `;

    const msgs = document.getElementById('messages');
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendSystem(text) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = text;
    const msgs = document.getElementById('messages');
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function updateUsers(users) {
    document.getElementById('online-count').textContent = users.length;
    const list = document.getElementById('user-list');
    list.innerHTML = users.map(u => `
      <div class="user-item">
        <div class="user-dot" style="background:${u.color}"></div>
        <span style="color:${u.color === myColor && u.name === myName ? '#fff' : '#cbd5e1'};font-size:12px">${escHtml(u.name)}</span>
      </div>
    `).join('');
  }

  function showTyping(name) {
    const area = document.getElementById('typing-area');
    area.textContent = `${name} est en train d'écrire…`;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { area.textContent = ''; }, 2000);
  }

  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { sendMessage(); return; }
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'typing' }));
    }
  });

  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'message', text }));
    input.value = '';
    input.focus();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
